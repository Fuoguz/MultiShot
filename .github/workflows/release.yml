name: Publish release

on:
  push:
    branches: ["main"]
    paths:
      - "VERSION.txt"
      - "MultiShot.cs"
      - "IconBuilder.cs"
      - "build.bat"
      - "README.md"
      - "README.zh-CN.md"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        shell: powershell
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: cmd
        run: call build.bat

      - name: Package
        shell: powershell
        run: |
          $name = "MultiShot-v$env:VERSION-Windows.zip"
          Compress-Archive -Path MultiShot.exe, README.md, README.zh-CN.md, CHANGELOG.md -DestinationPath $name -Force
          "PACKAGE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release if missing
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "%TAG%" >nul 2>nul
          if %ERRORLEVEL% EQU 0 (
            echo Release %TAG% already exists; skipping.
            exit /b 0
          )
          gh release create "%TAG%" "%PACKAGE_NAME%" --target "%GITHUB_SHA%" --title "MultiShot %TAG%" --notes-file RELEASE_NOTES.md
