name: Publish release

on:
  push:
    branches: ["main"]
    paths:
      - "VERSION.txt"
      - "MultiShot.cs"
      - "IconBuilder.cs"
      - "build.bat"
      - "README.md"
      - "README.zh-CN.md"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        shell: powershell
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: cmd
        run: call build.bat

      - name: Package
        shell: powershell
        run: |
          $name = "MultiShot-v$env:VERSION-Windows.zip"
          Compress-Archive -Path MultiShot.exe, README.md, README.zh-CN.md, CHANGELOG.md -DestinationPath $name -Force
          "PACKAGE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release if missing
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists; skipping."
            exit 0
          }
          gh release create $env:TAG $env:PACKAGE_NAME --target $env:GITHUB_SHA --title "MultiShot $env:TAG" --notes-file RELEASE_NOTES.md
